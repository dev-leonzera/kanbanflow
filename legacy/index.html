<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KanbanFlow — Gestão de Projetos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .dragging {
      opacity: 0.4;
      transform: scale(0.98);
    }
    .drop-zone-active {
      background-color: rgba(99, 102, 241, 0.1);
      border: 2px dashed #6366f1;
    }
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.4);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.6);
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col overflow-hidden font-sans">

  <!-- Header / Navbar -->
  <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 px-6 py-3 flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-lg shadow">
        K
      </div>
      <h1 class="text-xl font-bold tracking-tight text-white">KanbanFlow</h1>
    </div>

    <!-- Barra de Ferramentas -->
    <div class="flex items-center gap-3 flex-wrap">
      <input 
        id="searchInput" 
        type="text" 
        placeholder="Buscar tarefa ou tag..." 
        oninput="renderBoard()"
        class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"
      />
      
      <select 
        id="priorityFilter" 
        onchange="renderBoard()"
        class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"
      >
        <option value="ALL">Todas as Prioridades</option>
        <option value="HIGH">Alta Prioridade</option>
        <option value="MEDIUM">Média Prioridade</option>
        <option value="LOW">Baixa Prioridade</option>
      </select>

      <button 
        onclick="openColumnModal()" 
        class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium px-4 py-1.5 rounded-lg transition shadow"
      >
        + Nova Coluna
      </button>

      <button 
        onclick="resetBoard()" 
        title="Restaurar dados de exemplo"
        class="bg-slate-700 hover:bg-slate-600 text-slate-300 text-sm px-3 py-1.5 rounded-lg transition"
      >
        Resetar
      </button>
    </div>
  </header>

  <!-- Área do Quadro (Board) -->
  <main id="boardContainer" class="flex-1 flex gap-6 p-6 overflow-x-auto items-start">
    <!-- Colunas renderizadas via JS -->
  </main>

  <!-- Modal: Novo / Editar Cartão -->
  <div id="cardModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-xl w-full max-w-lg p-6 shadow-2xl max-h-[90vh] flex flex-col">
      <h2 id="modalTitle" class="text-lg font-bold mb-4">Nova Tarefa</h2>
      
      <form id="cardForm" onsubmit="saveCard(event)" class="space-y-4 overflow-y-auto pr-1 flex-1">
        <input type="hidden" id="cardColumnId">
        <input type="hidden" id="editCardId">

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Título</label>
          <input 
            id="cardTitleInput" 
            type="text" 
            required 
            placeholder="Ex: Implementar autenticação JWT"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Descrição</label>
          <textarea 
            id="cardDescInput" 
            rows="2" 
            placeholder="Detalhes técnicos, critérios de aceite..."
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"
          ></textarea>
        </div>

        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Prioridade</label>
            <select 
              id="cardPriorityInput"
              class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"
            >
              <option value="LOW">Baixa</option>
              <option value="MEDIUM" selected>Média</option>
              <option value="HIGH">Alta</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Tag</label>
            <input 
              id="cardTagInput" 
              type="text" 
              placeholder="Ex: Backend"
              class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"
            />
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Vencimento</label>
            <input 
              id="cardDueDateInput" 
              type="date" 
              class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"
            />
          </div>
        </div>

        <!-- Seção de Checklist no Modal -->
        <div class="pt-2 border-t border-slate-700/80">
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
            Checklist de Subtarefas
          </label>
          
          <div class="flex gap-2 mb-3">
            <input 
              id="newSubtaskInput" 
              type="text" 
              placeholder="Adicionar item ao checklist..."
              onkeydown="if(event.key === 'Enter'){ event.preventDefault(); addSubtaskToModal(); }"
              class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-indigo-500"
            />
            <button 
              type="button" 
              onclick="addSubtaskToModal()"
              class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg text-sm font-medium transition"
            >
              Adicionar
            </button>
          </div>

          <ul id="modalSubtaskList" class="space-y-1.5 max-h-40 overflow-y-auto">
            <!-- Subtarefas renderizadas via JS -->
          </ul>
        </div>

        <div class="flex justify-end gap-2 pt-4 border-t border-slate-700">
          <button type="button" onclick="closeCardModal()" class="px-4 py-2 text-sm rounded-lg bg-slate-700 hover:bg-slate-600">Cancelar</button>
          <button type="submit" class="px-4 py-2 text-sm rounded-lg bg-indigo-600 hover:bg-indigo-500 font-medium">Salvar Tarefa</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript da Aplicação -->
  <script>
    const STORAGE_KEY = 'kanbanflow_state_v2';

    // Datas dinâmicas para o exemplo inicial ficar sempre realista
    function getOffsetDate(days) {
      const d = new Date();
      d.setDate(d.getDate() + days);
      return d.toISOString().split('T')[0];
    }

    const DEFAULT_STATE = {
      columns: [
        {
          id: 'col-backlog',
          title: 'Backlog',
          cards: [
            { 
              id: 'c-1', 
              title: 'Modelar banco de dados relacional', 
              desc: 'Criar tabelas de usuários, projetos e tasks com índices.', 
              priority: 'HIGH', 
              tag: 'Database',
              dueDate: getOffsetDate(-1), // Atrasado (ontem)
              subtasks: [
                { id: 'st-1', text: 'Definir chave estrangeira em cards', done: true },
                { id: 'st-2', text: 'Criar índice composto para ordenação', done: false },
                { id: 'st-3', text: 'Rodar migration inicial', done: false }
              ]
            },
            { 
              id: 'c-2', 
              title: 'Configurar pipeline CI/CD', 
              desc: 'Rodar testes automatizados a cada push na main.', 
              priority: 'MEDIUM', 
              tag: 'DevOps',
              dueDate: getOffsetDate(4),
              subtasks: []
            }
          ]
        },
        {
          id: 'col-doing',
          title: 'Em Progresso',
          cards: [
            { 
              id: 'c-3', 
              title: 'Criar endpoints REST de tarefas', 
              desc: 'Implementar CRUD com validação de payload.', 
              priority: 'HIGH', 
              tag: 'Backend',
              dueDate: getOffsetDate(0), // Vence hoje
              subtasks: [
                { id: 'st-4', text: 'POST /cards com DTO validado', done: true },
                { id: 'st-5', text: 'PATCH /cards/:id/move', done: true },
                { id: 'st-6', text: 'Testes de integração', done: false }
              ]
            }
          ]
        },
        {
          id: 'col-done',
          title: 'Concluído',
          cards: [
            { 
              id: 'c-4', 
              title: 'Setup inicial do repositório', 
              desc: 'Estrutura base e linter configurados.', 
              priority: 'LOW', 
              tag: 'Setup',
              dueDate: getOffsetDate(-3),
              subtasks: [
                { id: 'st-7', text: 'Inicializar projeto e dependências', done: true },
                { id: 'st-8', text: 'Configurar ESLint + Prettier', done: true }
              ]
            }
          ]
        }
      ]
    };

    let state = loadState();
    let draggedCardId = null;
    let sourceColId = null;
    let modalSubtasks = []; // Estado temporário do checklist durante criação/edição no modal

    function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      return saved ? JSON.parse(saved) : structuredClone(DEFAULT_STATE);
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function resetBoard() {
      if (confirm('Deseja restaurar o quadro para o estado inicial de exemplo?')) {
        state = structuredClone(DEFAULT_STATE);
        saveState();
        renderBoard();
      }
    }

    function getPriorityBadge(priority) {
      const map = {
        HIGH: { label: 'Alta', classes: 'bg-rose-500/20 text-rose-300 border-rose-500/30' },
        MEDIUM: { label: 'Média', classes: 'bg-amber-500/20 text-amber-300 border-amber-500/30' },
        LOW: { label: 'Baixa', classes: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30' }
      };
      return map[priority] || map.MEDIUM;
    }

    // Avalia status da data de vencimento (Atrasado, Hoje, No Prazo)
    function getDueDateBadge(dueDateStr, isAllCompleted) {
      if (!dueDateStr) return '';

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const [year, month, day] = dueDateStr.split('-').map(Number);
      const due = new Date(year, month - 1, day);

      const formatted = `${String(day).padStart(2, '0')}/${String(month).padStart(2, '0')}`;
      const diffDays = Math.round((due - today) / (1000 * 60 * 60 * 24));

      if (isAllCompleted) {
        return `<span title="Concluído" class="text-[11px] flex items-center gap-1 px-2 py-0.5 rounded bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">
          ✓ ${formatted}
        </span>`;
      }

      if (diffDays < 0) {
        return `<span title="Atrasado!" class="text-[11px] font-medium flex items-center gap-1 px-2 py-0.5 rounded bg-rose-500/20 text-rose-300 border border-rose-500/40">
          ⚠ Atrasado (${formatted})
        </span>`;
      }

      if (diffDays === 0) {
        return `<span title="Vence Hoje" class="text-[11px] font-medium flex items-center gap-1 px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/40">
          ⏰ Hoje (${formatted})
        </span>`;
      }

      return `<span title="Data de entrega" class="text-[11px] flex items-center gap-1 px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">
        📅 ${formatted}
      </span>`;
    }

    function renderBoard() {
      const container = document.getElementById('boardContainer');
      const searchQuery = document.getElementById('searchInput').value.toLowerCase();
      const priorityFilter = document.getElementById('priorityFilter').value;

      container.innerHTML = '';

      state.columns.forEach(col => {
        const filteredCards = col.cards.filter(card => {
          const matchesSearch = card.title.toLowerCase().includes(searchQuery) || 
                                (card.desc && card.desc.toLowerCase().includes(searchQuery)) ||
                                (card.tag && card.tag.toLowerCase().includes(searchQuery));
          const matchesPriority = priorityFilter === 'ALL' || card.priority === priorityFilter;
          return matchesSearch && matchesPriority;
        });

        const colEl = document.createElement('section');
        colEl.className = 'bg-slate-800/90 border border-slate-700/80 rounded-xl w-80 shrink-0 flex flex-col max-h-full shadow-lg';
        
        colEl.innerHTML = `
          <!-- Topo da Coluna -->
          <div class="p-3.5 border-b border-slate-700/80 flex items-center justify-between">
            <div class="flex items-center gap-2">
              <h2 class="font-semibold text-sm text-slate-100">${escapeHtml(col.title)}</h2>
              <span class="text-xs px-2 py-0.5 rounded-full bg-slate-700 text-slate-300 font-medium">${filteredCards.length}</span>
            </div>
            <button onclick="deleteColumn('${col.id}')" title="Excluir coluna" class="text-slate-400 hover:text-rose-400 text-xs px-1.5 py-0.5 rounded">
              ✕
            </button>
          </div>

          <!-- Lista de Cartões (Drop Zone) -->
          <div 
            class="p-3 space-y-3 overflow-y-auto flex-1 min-h-[120px] transition-colors rounded-b-xl"
            ondragover="handleDragOver(event)"
            ondragleave="handleDragLeave(event)"
            ondrop="handleDrop(event, '${col.id}')"
          >
            ${filteredCards.map(card => {
              const badge = getPriorityBadge(card.priority);
              const subtasks = card.subtasks || [];
              const totalSub = subtasks.length;
              const doneSub = subtasks.filter(s => s.done).length;
              const percent = totalSub > 0 ? Math.round((doneSub / totalSub) * 100) : 0;
              const isAllCompleted = (totalSub > 0 && doneSub === totalSub) || col.id === 'col-done';
              const dueDateBadge = getDueDateBadge(card.dueDate, isAllCompleted);

              return `
                <article 
                  draggable="true"
                  ondragstart="handleDragStart(event, '${card.id}', '${col.id}')"
                  ondragend="handleDragEnd(event)"
                  class="bg-slate-900 border border-slate-700/90 hover:border-indigo-500/60 rounded-lg p-3.5 shadow cursor-grab active:cursor-grabbing transition group"
                >
                  <!-- Badges Superiores -->
                  <div class="flex items-center justify-between gap-1.5 flex-wrap mb-2">
                    <div class="flex items-center gap-1.5">
                      <span class="text-[11px] font-medium px-2 py-0.5 rounded border ${badge.classes}">
                        ${badge.label}
                      </span>
                      ${card.tag ? `<span class="text-[11px] bg-indigo-500/10 text-indigo-300 border border-indigo-500/20 px-2 py-0.5 rounded">${escapeHtml(card.tag)}</span>` : ''}
                    </div>
                    ${dueDateBadge}
                  </div>

                  <!-- Título e Descrição -->
                  <h3 class="font-medium text-sm text-slate-100 mb-1 leading-snug">${escapeHtml(card.title)}</h3>${card.desc ? `<p class="text-xs text-slate-400 line-clamp-2 mb-3">${escapeHtml(card.desc)}</p>` : ''}

                  <!-- Barra de Progresso e Checklist -->
                  ${totalSub > 0 ? `
                    <div class="mt-3 pt-2.5 border-t border-slate-800/90">
                      <div class="flex items-center justify-between text-[11px] text-slate-400 mb-1.5">
                        <span class="font-medium">Checklist</span>
                        <span class="${percent === 100 ? 'text-emerald-400 font-semibold' : ''}">${doneSub}/${totalSub} (${percent}%)</span>
                      </div>
                      <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden mb-2.5">
                        <div 
                          class="h-full transition-all duration-300 ${percent === 100 ? 'bg-emerald-500' : 'bg-indigo-500'}" 
                          style="width: ${percent}%"
                        ></div>
                      </div>
                      <div class="space-y-1 max-h-28 overflow-y-auto pr-1">
                        ${subtasks.map(st => `
                          <label class="flex items-start gap-2 text-xs text-slate-300 cursor-pointer hover:text-white select-none">
                            <input 
                              type="checkbox" 
                              ${st.done ? 'checked' : ''} 
                              onchange="toggleSubtaskOnCard('${col.id}', '${card.id}', '${st.id}')"
                              class="mt-0.5 rounded bg-slate-800 border-slate-600 text-indigo-600 focus:ring-0 cursor-pointer"
                            />
                            <span class="${st.done ? 'line-through text-slate-500' : ''} leading-tight">${escapeHtml(st.text)}</span>
                          </label>
                        `).join('')}
                      </div>
                    </div>
                  ` : ''}

                  <!-- Ações do Cartão -->
                  <div class="flex justify-end gap-2 pt-2 mt-2 border-t border-slate-800 opacity-0 group-hover:opacity-100 transition-opacity">
                    <button onclick="openEditCardModal('${col.id}', '${card.id}')" class="text-xs text-slate-400 hover:text-indigo-400">Editar</button>
                    <button onclick="deleteCard('${col.id}', '${card.id}')" class="text-xs text-slate-400 hover:text-rose-400">Excluir</button>
                  </div>
                </article>
              `;
            }).join('')}
          </div>

          <!-- Botão Adicionar Cartão -->
          <div class="p-3 pt-0">
            <button 
              onclick="openNewCardModal('${col.id}')"
              class="w-full py-2 text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-700/50 rounded-lg border border-dashed border-slate-700 transition"
            >
              + Adicionar Tarefa
            </button>
          </div>
        `;

        container.appendChild(colEl);
      });
    }

    // Alterna subtarefa diretamente no card do quadro
    function toggleSubtaskOnCard(colId, cardId, subtaskId) {
      const col = state.columns.find(c => c.id === colId);
      const card = col?.cards.find(c => c.id === cardId);
      const subtask = card?.subtasks?.find(s => s.id === subtaskId);
      if (!subtask) return;

      subtask.done = !subtask.done;
      saveState();
      renderBoard();
    }

    // --- Gerenciamento de Subtarefas dentro do Modal ---
    function renderModalSubtasks() {
      const listEl = document.getElementById('modalSubtaskList');
      if (modalSubtasks.length === 0) {
        listEl.innerHTML = `<li class="text-xs text-slate-500 italic py-1">Nenhuma subtarefa adicionada.</li>`;
        return;
      }

      listEl.innerHTML = modalSubtasks.map(st => `
        <li class="flex items-center justify-between gap-2 bg-slate-900/90 border border-slate-700/70 px-3 py-1.5 rounded-lg">
          <label class="flex items-center gap-2 text-xs text-slate-200 cursor-pointer flex-1">
            <input 
              type="checkbox" 
              ${st.done ? 'checked' : ''} 
              onchange="toggleModalSubtask('${st.id}')"
              class="rounded bg-slate-800 border-slate-600 text-indigo-600"
            />
            <span class="${st.done ? 'line-through text-slate-500' : ''}">${escapeHtml(st.text)}</span>
          </label>
          <button 
            type="button" 
            onclick="removeModalSubtask('${st.id}')"
            class="text-slate-500 hover:text-rose-400 text-xs px-1"
          >
            ✕
          </button>
        </li>
      `).join('');
    }

    function addSubtaskToModal() {
      const input = document.getElementById('newSubtaskInput');
      const text = input.value.trim();
      if (!text) return;

      modalSubtasks.push({
        id: 'st-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
        text,
        done: false
      });
      input.value = '';
      renderModalSubtasks();
      input.focus();
    }

    function toggleModalSubtask(subtaskId) {
      const st = modalSubtasks.find(s => s.id === subtaskId);
      if (st) {
        st.done = !st.done;
        renderModalSubtasks();
      }
    }

    function removeModalSubtask(subtaskId) {
      modalSubtasks = modalSubtasks.filter(s => s.id !== subtaskId);
      renderModalSubtasks();
    }

    // --- Drag and Drop Handlers ---
    function handleDragStart(e, cardId, colId) {
      draggedCardId = cardId;
      sourceColId = colId;
      e.target.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragEnd(e) {
      e.target.classList.remove('dragging');
      document.querySelectorAll('.drop-zone-active').forEach(el => el.classList.remove('drop-zone-active'));
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.currentTarget.classList.add('drop-zone-active');
    }

    function handleDragLeave(e) {
      e.currentTarget.classList.remove('drop-zone-active');
    }

    function handleDrop(e, targetColId) {
      e.preventDefault();
      e.currentTarget.classList.remove('drop-zone-active');

      if (!draggedCardId || !sourceColId) return;

      const sourceCol = state.columns.find(c => c.id === sourceColId);
      const targetCol = state.columns.find(c => c.id === targetColId);
      if (!sourceCol || !targetCol) return;

      const cardIndex = sourceCol.cards.findIndex(c => c.id === draggedCardId);
      if (cardIndex === -1) return;

      const [movedCard] = sourceCol.cards.splice(cardIndex, 1);
      targetCol.cards.push(movedCard);

      draggedCardId = null;
      sourceColId = null;
      saveState();
      renderBoard();
    }

    // --- CRUD de Cartões e Colunas ---
    function openNewCardModal(colId) {
      document.getElementById('modalTitle').textContent = 'Nova Tarefa';
      document.getElementById('cardColumnId').value = colId;
      document.getElementById('editCardId').value = '';
      document.getElementById('cardForm').reset();
      modalSubtasks = [];
      renderModalSubtasks();

      const modal = document.getElementById('cardModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      document.getElementById('cardTitleInput').focus();
    }

    function openEditCardModal(colId, cardId) {
      const col = state.columns.find(c => c.id === colId);
      const card = col?.cards.find(c => c.id === cardId);
      if (!card) return;

      document.getElementById('modalTitle').textContent = 'Editar Tarefa';
      document.getElementById('cardColumnId').value = colId;
      document.getElementById('editCardId').value = cardId;
      document.getElementById('cardTitleInput').value = card.title;
      document.getElementById('cardDescInput').value = card.desc || '';
      document.getElementById('cardPriorityInput').value = card.priority;
      document.getElementById('cardTagInput').value = card.tag || '';
      document.getElementById('cardDueDateInput').value = card.dueDate || '';
      
      modalSubtasks = structuredClone(card.subtasks || []);
      renderModalSubtasks();

      const modal = document.getElementById('cardModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeCardModal() {
      const modal = document.getElementById('cardModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function saveCard(e) {
      e.preventDefault();
      const colId = document.getElementById('cardColumnId').value;
      const editId = document.getElementById('editCardId').value;
      const title = document.getElementById('cardTitleInput').value.trim();
      const desc = document.getElementById('cardDescInput').value.trim();
      const priority = document.getElementById('cardPriorityInput').value;
      const tag = document.getElementById('cardTagInput').value.trim();
      const dueDate = document.getElementById('cardDueDateInput').value;

      const col = state.columns.find(c => c.id === colId);
      if (!col || !title) return;

      if (editId) {
        const card = col.cards.find(c => c.id === editId);
        if (card) {
          card.title = title;
          card.desc = desc;
          card.priority = priority;
          card.tag = tag;
          card.dueDate = dueDate;
          card.subtasks = structuredClone(modalSubtasks);
        }
      } else {
        col.cards.push({
          id: 'card-' + Date.now(),
          title,
          desc,
          priority,
          tag,
          dueDate,
          subtasks: structuredClone(modalSubtasks)
        });
      }

      saveState();
      closeCardModal();
      renderBoard();
    }

    function deleteCard(colId, cardId) {
      const col = state.columns.find(c => c.id === colId);
      if (!col) return;
      col.cards = col.cards.filter(c => c.id !== cardId);
      saveState();
      renderBoard();
    }

    function openColumnModal() {
      const title = prompt('Nome da nova coluna:');
      if (!title || !title.trim()) return;
      state.columns.push({
        id: 'col-' + Date.now(),
        title: title.trim(),
        cards: []
      });
      saveState();
      renderBoard();
    }

    function deleteColumn(colId) {
      if (!confirm('Excluir esta coluna e todas as tarefas dentro dela?')) return;
      state.columns = state.columns.filter(c => c.id !== colId);
      saveState();
      renderBoard();
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Inicializa o quadro
    renderBoard();
  </script>
</body>
</html>
